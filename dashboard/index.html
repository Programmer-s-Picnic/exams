<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Dashboard</div><h1 id="welcome">Student dashboard</h1><p>Your preparation status and next action.</p></div></section><section class="section wrap"><div class="card-grid" id="cards"></div></section></main><div id="site-footer"></div><script src="../assets/js/components-loader.js"></script><script src="../assets/js/authentication.js"></script><script>const s=Auth.session(),r=JSON.parse(localStorage.getItem('he_latest_result')||'null');if(s)welcome.textContent=`Welcome, ${s.name}`;cards.innerHTML=`<article class="content-card"><h2>Latest test</h2><p>${r?`${r.percentage}% · Level ${r.level}`:'No test attempted yet.'}</p><a class="button" href="../tests/">${r?'Test again':'Start test'}</a></article><article class="content-card"><h2>Target examination</h2><p>CTET Paper I · 12–13 December 2026</p><a class="text-link" href="../exam/?id=ctet-paper-1">View details →</a></article><article class="content-card"><h2>Next action</h2><p>${r&&r.level===3?'Take a full section test.':r?'Study your weak sections and repeat the diagnostic.':'Complete your first diagnostic test.'}</p></article>`</script></body></html>
