<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><form class="form-card" id="form"><span class="eyebrow">FREE REGISTRATION</span><h1>Create your account</h1><p class="form-note">During the prototype, your account is stored only on this device. Central accounts will begin with the PHP server.</p><label>Full name<input name="name" required minlength="2"></label><label>Mobile number<input name="mobile" required inputmode="numeric" pattern="[0-9]{10}"></label><label>Email address<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="6"></label><label>Target exam<select name="targetExamId"><option value="ctet-paper-1">CTET Paper I</option><option value="uptet-paper-1">UPTET Paper I</option></select></label><button class="button full" type="submit">Register</button><p id="message" class="message"></p><p>Already registered? <a class="text-link" href="../login/">Login</a></p></form></main><div id="site-footer"></div><script src="../assets/js/components-loader.js"></script><script src="../assets/js/authentication.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await Auth.register(Object.fromEntries(new FormData(form)));message.className='message success';message.textContent='Registration successful. You can now log in.';form.reset()}catch(x){message.className='message error';message.textContent=x.message}}</script></body></html>
