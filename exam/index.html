<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam details | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Exams / Details</div><h1 id="title">Examination details</h1><p id="summary">Loading verified information…</p></div></section><div class="wrap page-layout"><aside class="side-nav"><a href="#schedule">Schedule</a><a href="#pattern">Pattern</a><a href="../syllabus/">Syllabus</a><a href="../tests/">Sample tests</a><a href="../official-links/">Official links</a></aside><article class="content-card" id="content"><div class="loading">Loading…</div></article></div></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/data-service.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'ctet-paper-1';Promise.all([DataService.getExams(),DataService.getSyllabi()]).then(([a,b])=>{const e=a.exams.find(x=>x.id===id),s=b.syllabi.find(x=>x.examId===id);title.textContent=e.name;summary.textContent=e.summary;content.innerHTML=`<span class="status ${e.statusClass}">${e.statusLabel}</span><h2 id="schedule">Schedule</h2><table class="data-table">${Object.entries(e.schedule).map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table><h2 id="pattern">Exam pattern</h2><table class="data-table"><tr><th>Section</th><th>Questions</th><th>Marks</th></tr>${s.sections.map(x=>`<tr><td>${x.name}</td><td>${x.questions}</td><td>${x.marks}</td></tr>`).join('')}</table><p><strong>Duration:</strong> ${s.durationMinutes} minutes · <strong>Negative marking:</strong> ${s.negativeMarking?'Yes':'No'}</p><a class="button" href="../tests/">Take a sample test</a>`}).catch(()=>content.innerHTML='<div class="empty">Unable to load details.</div>')</script></body></html>
