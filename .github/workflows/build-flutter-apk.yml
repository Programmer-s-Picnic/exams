name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete Android scaffold
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org live.learnwithchampak --project-name himanshu_exams .
          rm -f test/widget_test.dart
      - name: Get packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Verify source
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Publish APK in repository
        run: |
          mkdir -p releases
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk releases/himanshu-exams.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add releases/himanshu-exams.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Himanshu Exams Android APK"
          git stash --include-untracked
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: himanshu-exams-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
