name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete Android scaffold
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --org live.learnwithchampak --project-name himanshu_exams .
          rm -f test/widget_test.dart
      - name: Configure release signing
        working-directory: flutter_app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_PASSWORD" "$RELEASE_KEY_ALIAS" > android/key.properties
      - name: Get packages
        working-directory: flutter_app
        run: flutter pub get
      - name: Verify source
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos
      - name: Build signed 32-bit and 64-bit APKs
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Build signed Google Play AAB
        working-directory: flutter_app
        run: flutter build appbundle --release --target-platform android-arm,android-arm64
      - name: Stage verified release files
        run: |
          set -euo pipefail
          mkdir -p releases
          cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk releases/exampreps-64.apk
          cp flutter_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk releases/exampreps-32.apk
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab releases/exampreps-playstore.aab
          test -s releases/exampreps-64.apk
          test -s releases/exampreps-32.apk
          test -s releases/exampreps-playstore.aab
          sha256sum releases/exampreps-64.apk releases/exampreps-32.apk releases/exampreps-playstore.aab > releases/SHA256SUMS.txt
      - name: Publish release files on website
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add releases/exampreps-64.apk releases/exampreps-32.apk releases/exampreps-playstore.aab releases/SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish signed Exams APKs and Play AAB"
          git stash --include-untracked
          git fetch origin main
          BUILT_VERSION=$(git show HEAD:flutter_app/pubspec.yaml | sed -n 's/^version: //p')
          LIVE_VERSION=$(git show origin/main:flutter_app/pubspec.yaml | sed -n 's/^version: //p')
          if [ "$BUILT_VERSION" != "$LIVE_VERSION" ]; then
            echo "Skipping stale Android build $BUILT_VERSION; current source is $LIVE_VERSION"
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: exampreps-release
          path: |
            releases/exampreps-64.apk
            releases/exampreps-32.apk
            releases/exampreps-playstore.aab
            releases/SHA256SUMS.txt
