<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official links | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Official Links</div><h1>Verified official links</h1><p>Use these government portals for applications, notices, admit cards and results.</p></div></section><section class="section wrap"><div class="card-grid" id="links"><div class="loading">Loading links…</div></div></section></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/data-service.js"></script><script>DataService.getOfficialLinks().then(d=>links.innerHTML=d.links.map(x=>`<article class="content-card"><span class="status confirmed">Official</span><h2>${x.name}</h2><p>${x.purpose}</p><a class="button" href="${x.url}" target="_blank" rel="noopener">Open official site</a></article>`).join('')).catch(()=>links.innerHTML='<div class="empty">Unable to load official links.</div>')</script></body></html>
