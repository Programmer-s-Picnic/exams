<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample tests | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Tests</div><h1>Preparation-status tests</h1><p>Start with a short diagnostic test and receive an immediate preparation level.</p></div></section><section class="section wrap"><div id="tests" class="card-grid"><div class="loading">Loading tests…</div></div></section></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/data-service.js"></script><script>DataService.getTests().then(d=>tests.innerHTML=d.tests.map(t=>`<article class="exam-card"><span class="status confirmed">${t.access}</span><h2>${t.title}</h2><p>${t.description}</p><p><strong>${t.questionIds.length}</strong> questions · <strong>${t.durationMinutes}</strong> minutes</p><a class="button" href="../test/?id=${t.id}">Start test</a></article>`).join('')).catch(()=>tests.innerHTML='<div class="empty">Unable to load test data.</div>')</script></body></html>
