<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exams | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Exams</div><h1>Primary-teacher examinations</h1><p>Confirmed schedules and preparation information, with unverified claims excluded.</p></div></section><section class="section wrap"><div class="card-grid" id="examCards"><div class="loading">Loading examinations…</div></div></section></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/data-service.js"></script><script>DataService.getExams().then(d=>examCards.innerHTML=d.exams.map(e=>`<article class="exam-card"><span class="status ${e.statusClass}">${e.statusLabel}</span><h3>${e.name}</h3><p>${e.summary}</p><footer><span>${e.nextDate||'Date awaited'}</span><a class="text-link" href="../exam/?id=${e.id}">Details →</a></footer></article>`).join('')).catch(()=>examCards.innerHTML='<div class="empty">Unable to load examination data.</div>')</script></body></html>
