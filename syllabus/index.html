<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syllabus | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><section class="page-hero"><div class="wrap"><div class="breadcrumbs">Home / Syllabus</div><h1>CTET Paper I syllabus</h1><p>Five compulsory sections for candidates intending to teach Classes I–V.</p></div></section><section class="section wrap"><div id="syllabus" class="card-grid"><div class="loading">Loading syllabus…</div></div></section></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/data-service.js"></script><script>DataService.getSyllabi().then(d=>{const s=d.syllabi.find(x=>x.examId==='ctet-paper-1');syllabus.innerHTML=s.sections.map(x=>`<article class="content-card"><span class="status confirmed">${x.questions} marks</span><h2>${x.name}</h2><ul>${x.topics.map(t=>`<li>${t}</li>`).join('')}</ul></article>`).join('')}).catch(()=>syllabus.innerHTML='<div class="empty">Unable to load syllabus.</div>')</script></body></html>
