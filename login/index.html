<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Himanshu Exams</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body data-root="../"><div id="site-header"></div><main><form class="form-card" id="form"><span class="eyebrow">STUDENT LOGIN</span><h1>Welcome back</h1><p class="form-note"><strong>Demo login</strong><br>Email: aarav.demo@himanshuexams.test<br>Password: Demo@123</p><label>Email address<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button full" type="submit">Login</button><p id="message" class="message"></p><p>New student? <a class="text-link" href="../register/">Register free</a></p></form></main><div id="site-footer"></div><script src="../assets/js/config.js"></script><script src="../assets/js/components-loader.js"></script><script src="../assets/js/authentication.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));message.className='message';message.textContent='Checking account…';try{await Auth.login(d.email,d.password);location.href='../dashboard/'}catch(x){message.className='message error';message.textContent=x.message}}</script></body></html>
